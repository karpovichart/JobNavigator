name: CI

on:
  workflow_dispatch:

# Principle of least privilege: workflow only lints and builds local Docker
# images, never pushes. Read-only contents access is sufficient.
permissions:
  contents: read

jobs:
  lint-python:
    name: Lint Python
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff
      - name: Run ruff (lenient — errors only, no style warnings)
        run: |
          ruff check backend/ --select=E9,F63,F7,F82 --output-format=github
        # E9 syntax errors, F63 pointless comparisons, F7 syntax, F82 undefined names
        # We skip style rules since this is a personal project

  test-python:
    name: Run pytest (backend)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install backend deps
        # Tests mock Playwright/Anthropic/httpx so no browser install or API keys needed.
        run: pip install -r backend/requirements.txt
      - name: Run pytest
        env:
          DATABASE_URL: "sqlite:///:memory:"
        run: |
          pytest backend/tests/ --tb=short

  test-frontend:
    # R30 I-07: the Vitest specs and the style lint ran only on a developer's machine.
    name: Frontend tests and style lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install frontend deps
        # No lockfile on purpose (tests/tools/fe-test.sh installs the same way), so the
        # image build and the tests resolve the same ranges.
        working-directory: frontend
        run: npm install --no-audit --no-fund --no-package-lock
      - name: Vitest
        working-directory: frontend
        env:
          TZ: UTC
          CI: "1"
        run: npx vitest run
      - name: Style lint (no raw colour, font, radius or shadow outside ui.jsx / theme.css)
        run: python3 tests/tools/stylelint.py

  audit-deps:
    name: Dependency vulnerability scan
    runs-on: ubuntu-24.04
    # Advisory only — don't block the build on CVEs in third-party deps that
    # we can't fix immediately. Rely on the GitHub Actions summary to flag them.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Scan backend/requirements.txt for known CVEs
        run: pip-audit -r backend/requirements.txt --strict

  build-docker:
    name: Build Docker images
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Create minimal .env
        run: cp .env.example .env
      - name: Build backend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.backend
          push: false
          # Keep CI and the publish workflow on the same per-image cache scopes.
          # Separate scopes prevent backend/frontend builds from replacing each other's cache.
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
      - name: Build frontend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.frontend
          push: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
